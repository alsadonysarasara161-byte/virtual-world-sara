<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>العالم الافتراضي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;font-family:system-ui,Arial;background:#b9d9f8;touch-action:none}canvas{display:block}
#creator{position:fixed;inset:0;z-index:5;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(145deg,#d9ecff,#f4e5ff)}.card{width:min(100%,430px);background:#ffffffee;border-radius:26px;padding:20px;box-shadow:0 14px 40px #4a669933;color:#51456b;text-align:center}.card h1{margin:0 0 6px;font-size:27px}.muted{color:#8b82a2;margin:0 0 14px}.preview{height:160px;display:flex;justify-content:center;align-items:center}.preview figure{position:relative;margin:0;width:82px;height:115px;border-radius:45px 45px 22px 22px;background:var(--skin);box-shadow:inset 0 -18px var(--cloth)}.preview figure:before{content:'';position:absolute;top:-15px;left:4px;width:74px;height:53px;background:var(--hair);border-radius:50% 50% 35% 35%}.preview figure:after{content:'●   ●';position:absolute;top:36px;left:19px;color:#333;font-size:9px;letter-spacing:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;text-align:right;font-size:13px;font-weight:700;margin:9px 0 5px}input,select{width:100%;border:1px solid #e4dced;border-radius:13px;background:#fcfaff;color:#56496e;padding:12px;font-size:15px}button{border:0;border-radius:14px;padding:12px;background:#e7d9fa;color:#55456e;font-weight:700;font-size:14px}#enter{width:100%;margin-top:14px;background:#9378c8;color:white;font-size:17px}#hud{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:7px;justify-content:space-between;pointer-events:none}.pill{background:#ffffffdf;border-radius:14px;padding:9px 12px;color:#5a4b77;font-size:12px;box-shadow:0 3px 10px #0001}#joystick{position:absolute;z-index:2;bottom:22px;left:22px;width:120px;height:120px;border-radius:50%;background:#ffffff55;border:2px solid #fff9}#knob{position:absolute;left:33px;top:33px;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 4px 10px #0002}#help{position:absolute;bottom:20px;right:10px;z-index:2;background:#65547d99;color:white;border-radius:12px;padding:9px;font-size:11px}#toast{position:absolute;z-index:4;bottom:22%;left:50%;transform:translateX(-50%);background:#fff;color:#5a4a78;border-radius:16px;padding:12px 18px;display:none;max-width:90%;text-align:center}#modal{display:none;position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:min(88%,330px);background:white;color:#58466f;border-radius:22px;padding:20px;text-align:center}#modal button{margin:5px}#connect{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;text-shadow:0 1px 3px #444;z-index:2}
</style></head><body>
<div id="creator"><div class="card"><h1>🌐 العالم الافتراضي</h1><p class="muted">صمّم شخصيتك وادخل مدينة اللاعبين</p><div class="preview"><figure id="preview"></figure></div>
<label>اسمك داخل اللعبة</label><input id="name" maxlength="18" placeholder="اكتب اسمك">
<div class="grid"><div><label>نوع الشخصية</label><select id="body"><option value="girl">بنت</option><option value="boy">ولد</option></select></div><div><label>لون البشرة</label><select id="skin"><option value="#f4d0b1">فاتح</option><option value="#d9a27c">قمحي</option><option value="#b87952">أسمر</option><option value="#75452f">داكن</option></select></div>
<div><label>لون الشعر</label><select id="hair"><option value="#39271f">أسود</option><option value="#70462e">بني</option><option value="#d7ad65">أشقر</option><option value="#bd536d">وردي</option><option value="#7777b9">بنفسجي</option></select></div><div><label>لون الملابس</label><select id="clothes"><option value="#e99cbe">وردي</option><option value="#82b7e9">أزرق</option><option value="#8fc5a0">أخضر</option><option value="#8577b7">بنفسجي</option><option value="#373945">أسود</option><option value="#f2f0e9">أبيض</option></select></div><div><label>قصة الشعر</label><select id="style"><option value="long">طويل</option><option value="short">قصير</option><option value="curly">مجعد</option></select></div></div>
<button id="enter">دخول العالم ✨</button><p class="muted" style="font-size:11px;margin-top:12px">ملاحظة: هذه نسخة تجريبية؛ الاتصال يزامن حركة اللاعبين فقط.</p></div></div>
<div id="hud"><div class="pill">🌐 العالم الافتراضي</div><div class="pill">👤 <span id="playerName">لاعب</span></div><div class="pill">👥 <span id="count">1</span></div><div class="pill">💰 5000</div></div>
<div id="joystick"><div id="knob"></div></div><div id="help">حرّك العصا للمشي<br>اسحب الشاشة لتدوير الكاميرا<br>اكبس على المباني للتفاعل</div><div id="toast"></div><div id="modal"><h3 id="mTitle"></h3><p id="mDesc"></p><div id="mActions"></div><button onclick="closeModal()">إغلاق</button></div><div id="connect">جارٍ الاتصال...</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);let profile={},scene,camera,renderer,avatar,angle=0,camDist=8,moveX=0,moveY=0,joyOn=false,joyCenter={x:0,y:0},camOn=false,last={x:0,y:0},touchMoved=false,objects=[],remotePlayers={},socket,clock=new THREE.Clock(),lastSync=0;
function preview(){ $('preview').style.setProperty('--skin',$('skin').value);$('preview').style.setProperty('--hair',$('hair').value);$('preview').style.setProperty('--cloth',$('clothes').value)}['skin','hair','clothes'].forEach(id=>$(id).onchange=preview);preview();
function makeAvatar(p){const g=new THREE.Group(),skinM=new THREE.MeshStandardMaterial({color:p.skin}),hairM=new THREE.MeshStandardMaterial({color:p.hair}),clothM=new THREE.MeshStandardMaterial({color:p.clothes}),dark=new THREE.MeshStandardMaterial({color:0x303039}),shoe=new THREE.MeshStandardMaterial({color:0xeee9e5});const capsule=(rad,len,mat)=>new THREE.Mesh(new THREE.CapsuleGeometry(rad,len,5,10),mat);
let torso=capsule(.35,.65,clothM);torso.position.y=1.25;g.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.36,24,20),skinM);head.scale.y=1.12;head.position.y=2.08;g.add(head);
let hairCap=new THREE.Mesh(new THREE.SphereGeometry(.4,24,18,0,Math.PI*2,0,Math.PI*.65),hairM);hairCap.position.y=2.34;g.add(hairCap);if(p.style!=='short'){for(let side of [-1,1]){let lock=capsule(.11,p.style==='long'?.65:.3,hairM);lock.position.set(side*.31,p.style==='long'?1.9:2.1,.02);g.add(lock)}}if(p.style==='curly'){for(let n=0;n<10;n++){let c=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),hairM),a=n/10*Math.PI*2;c.position.set(Math.cos(a)*.35,2.42,Math.sin(a)*.35);g.add(c)}}
for(let s of [-1,1]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.045,10,10),dark);eye.position.set(s*.12,2.07,.32);g.add(eye);let arm=capsule(.105,.55,skinM);arm.position.set(s*.48,1.25,0);arm.rotation.z=s*.12;g.add(arm);let leg=capsule(.14,.42,dark);leg.position.set(s*.17,.48,0);g.add(leg);let foot=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,.35),shoe);foot.position.set(s*.17,.12,.1);g.add(foot)}return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xb8d9f8);scene.fog=new THREE.Fog(0xb8d9f8,55,140);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,250);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x70819a,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-25,35,20);sun.castShadow=true;scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x86ca95}));ground.rotation.x=-Math.PI/2;scene.add(ground);road(0,0,12,220);road(0,0,220,12);for(let i=-100;i<100;i+=9){dash(i,0,2.6,.2);dash(0,i,.2,2.6)}
makeBuilding(-22,-20,0xffb7d0,'منطقة سكنية','home',10);makeBuilding(20,-20,0xffd59d,'مقهى','cafe',9);makeBuilding(-20,20,0xbcaaff,'متجر','shop',11);makeBuilding(20,20,0x9de3e9,'ألعاب','arcade',12);makeBuilding(-38,0,0xffc6a8,'مطعم','food',8);makeBuilding(38,0,0xd4b8ff,'فندق','hotel',15);makeBuilding(0,-38,0xffaabb,'سينما','cinema',12);makeBuilding(0,38,0x9bd4ff,'متجر الحيوانات','pets',9);for(let i=0;i<50;i++)tree((Math.random()-.5)*110,(Math.random()-.5)*110);makeCar(8,8);avatar=makeAvatar(profile);avatar.position.set(0,0,5);scene.add(avatar);socketConnect();animate()}
function road(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.04,d),new THREE.MeshStandardMaterial({color:0x515663}));m.position.set(x,.02,z);scene.add(m)}function dash(x,z,w,d){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.05,d),new THREE.MeshBasicMaterial({color:0xf7efc9}));m.position.set(x,.05,z);scene.add(m)}
function makeBuilding(x,z,color,name,type,h){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(7,h,7),new THREE.MeshStandardMaterial({color}));body.position.y=h/2;body.castShadow=true;g.add(body);for(let y=2;y<h-1;y+=2.5)for(let s of [-1,1]){let win=new THREE.Mesh(new THREE.BoxGeometry(1.2,1,.08),new THREE.MeshStandardMaterial({color:0xfff1c5,emissive:0x443311}));win.position.set(s*1.8,y,3.56);g.add(win)}let door=new THREE.Mesh(new THREE.BoxGeometry(1.3,2.3,.15),new THREE.MeshStandardMaterial({color:0x76553e}));door.position.set(0,1.15,3.58);g.add(door);g.position.set(x,0,z);scene.add(g);objects.push({mesh:g,name,type,x,z})}
function tree(x,z){let t=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2,8),new THREE.MeshStandardMaterial({color:0x815333}));t.position.set(x,1,z);scene.add(t);let l=new THREE.Mesh(new THREE.SphereGeometry(1.4,12,12),new THREE.MeshStandardMaterial({color:0x37a963}));l.position.set(x,3,z);scene.add(l)}
function makeCar(x,z){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(3,1,5),new THREE.MeshStandardMaterial({color:0xff78b3}));body.position.y=.8;g.add(body);let roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,1,2.5),new THREE.MeshStandardMaterial({color:0xdfeeff}));roof.position.y=1.55;g.add(roof);for(let s of [-1,1])for(let f of [-1,1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,16),new THREE.MeshStandardMaterial({color:0x222222}));w.rotation.z=Math.PI/2;w.position.set(s*1.5,.45,f*1.6);g.add(w)}g.position.set(x,0,z);scene.add(g);objects.push({mesh:g,name:'سيارة',type:'car',x,z});return g}
let car;function makeCar(x,z){car=makeCarObj(x,z)}function makeCarObj(x,z){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3,1,5),new THREE.MeshStandardMaterial({color:0xff78b3}));b.position.y=.8;g.add(b);let roof=new THREE.Mesh(new THREE.BoxGeometry(2.2,1,2.5),new THREE.MeshStandardMaterial({color:0xdfeeff}));roof.position.y=1.55;g.add(roof);for(let s of [-1,1])for(let f of [-1,1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,16),new THREE.MeshStandardMaterial({color:0x222222}));w.rotation.z=Math.PI/2;w.position.set(s*1.5,.45,f*1.6);g.add(w)}g.position.set(x,0,z);scene.add(g);objects.push({mesh:g,name:'سيارة',type:'car',x,z});return g}
function socketConnect(){socket=io();socket.on('connect',()=>{$('connect').textContent='متصل بالسيرفر 🌐';socket.emit('player:join',profile)});socket.on('connect_error',()=>{$('connect').textContent='تعذّر الاتصال بالسيرفر — وضع فردي'});socket.on('world:count',n=>$('count').textContent=n);socket.on('world:players',list=>list.forEach(p=>{if(p.id!==socket.id)addRemote(p)}));socket.on('player:joined',p=>{if(p.id!==socket.id)addRemote(p)});socket.on('player:moved',m=>{let r=remotePlayers[m.id];if(r){r.group.position.set(m.x,0,m.z);r.group.rotation.y=m.rotation}});socket.on('player:left',id=>{if(remotePlayers[id]){scene.remove(remotePlayers[id].group);delete remotePlayers[id]}})}
function addRemote(p){if(remotePlayers[p.id])return;let group=makeAvatar(p.avatar||{});group.position.set(p.x||0,0,p.z||0);group.rotation.y=p.rotation||0;scene.add(group);remotePlayers[p.id]={group,name:p.name};}
const joy=$('joystick'),knob=$('knob');joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);let r=joy.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2}};joy.onpointermove=e=>{if(!joyOn)return;let dx=e.clientX-joyCenter.x,dy=e.clientY-joyCenter.y,len=Math.hypot(dx,dy),max=40;if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform=`translate(${dx}px,${dy}px)`;moveX=dx/max;moveY=dy/max};function stopJoy(){joyOn=false;moveX=moveY=0;knob.style.transform='translate(0,0)'}joy.onpointerup=stopJoy;joy.onpointercancel=stopJoy;
renderer.domElement.addEventListener('pointerdown',e=>{camOn=true;touchMoved=false;last={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointermove',e=>{if(!camOn)return;let dx=e.clientX-last.x;if(Math.abs(dx)>2)touchMoved=true;angle-=dx*.005;last={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>camOn=false);renderer.domElement.addEventListener('pointercancel',()=>camOn=false);
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(touchMoved)return;pt.x=e.clientX/innerWidth*2-1;pt.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pt,camera);let hits=ray.intersectObjects(objects.flatMap(o=>{let a=[];o.mesh.traverse(c=>{if(c.isMesh)a.push(c)});return a}),true);if(!hits.length)return;let hit=hits[0].object,found=objects.find(o=>{let a=[];o.mesh.traverse(c=>{if(c.isMesh)a.push(c)});return a.includes(hit)});if(found)interact(found)});
function interact(o){let messages={home:'منطقة البيوت — تفاعل البيت وتطويره قيد الإضافة.',cafe:'المقهى: نظام الطلبات والتسوق قيد التطوير.',shop:'المتجر: شراء الملابس والأغراض قيد التطوير.',arcade:'مركز الألعاب: ألعاب مصغّرة قيد الإضافة.',food:'المطعم: الطلبات قيد التطوير.',hotel:'الفندق: الغرف قيد التطوير.',cinema:'السينما قيد التطوير.',pets:'الحيوانات الأليفة قيد التطوير.',car:'السيارة — قيادة المركبات قيد التطوير.'};toast(messages[o.type]||o.name)}
function toast(t){let el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2600)}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(avatar){let speed=4.5,f=new THREE.Vector3(-Math.sin(angle),0,-Math.cos(angle)),r=new THREE.Vector3(Math.cos(angle),0,-Math.sin(angle));avatar.position.addScaledVector(f,-moveY*speed*dt);avatar.position.addScaledVector(r,moveX*speed*dt);avatar.rotation.y=angle;camera.position.set(avatar.position.x+Math.sin(angle)*camDist,avatar.position.y+4.2,avatar.position.z+Math.cos(angle)*camDist);camera.lookAt(avatar.position.x,avatar.position.y+1,avatar.position.z);let now=Date.now();if(socket?.connected&&now-lastSync>100){lastSync=now;socket.emit('player:move',{x:avatar.position.x,z:avatar.position.z,rotation:avatar.rotation.y})}}renderer.render(scene,camera)}
$('enter').onclick=()=>{profile={name:$('name').value.trim()||'لاعب',body:$('body').value,skin:$('skin').value,hair:$('hair').value,clothes:$('clothes').value,style:$('style').value};$('playerName').textContent=profile.name;$('creator').style.display='none';init()};window.addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
</script></body></html>
